name: Build, Push, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kesec-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kesec-frontend

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history, not just the latest snapshot, to scan the actual commits being pushed

      - name: Gitleaks - scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine NVD API key argument
        id: nvd_arg
        run: |
          if [ -n "${{ secrets.NVD_API_KEY }}" ]; then
            echo "arg=--nvdApiKey ${{ secrets.NVD_API_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'kesec'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired
            ${{ steps.nvd_arg.outputs.arg }}

      - name: Upload Dependency-Check report
        if: always() # upload even when the scan fails the build, so the report explaining why is still visible
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history improves analysis relevance (blame info, new-code detection)

      # Pinned to an exact version, not a floating major tag - v6 was a
      # ground-up rewrite specifically to fix a command-injection
      # vulnerability in earlier releases of this action.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  build-and-push:
    needs: [gitleaks, dependency-check, sonarqube]
    # Validate the build on PRs, but only push images and deploy on actual
    # pushes to main - a PR shouldn't publish images or touch the VM.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NOTE: images are built with push:false/load:true here - loaded into
      # the local Docker daemon but NOT pushed yet. They're only pushed
      # further down, after Trivy has scanned them. This is what makes the
      # scan an actual gate rather than a report generated after the fact.

      - name: Build backend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          pull: true # always fetch the freshest base image layers, not a stale cached copy
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          pull: true # always fetch the freshest base image layers, not a stale cached copy
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Installing the Trivy CLI directly from its pinned official release,
      # rather than using aquasecurity/trivy-action - that wrapper Action had
      # 76 of its 77 release tags hijacked in a March 2026 supply-chain
      # attack that stole CI/CD secrets from runners using it. Same reasoning
      # as using raw ssh/scp for deployment instead of a third-party action.
      - name: Install Trivy (pinned official release binary)
        run: |
          TRIVY_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing Trivy v${TRIVY_VERSION}"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -zxf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy scan - backend image
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --format table \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Trivy scan - frontend image
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --format table \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # Only reached if both scans passed (exit-code 1 above would have
      # already stopped the job otherwise).
      - name: Push backend image
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        run: |
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files to VM
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "mkdir -p ~/kesec"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml Caddyfile \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/kesec/"

      - name: Write .env on VM from GitHub Secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          CADDY_ADDRESS="$VM_HOST"
          if [[ "$VM_HOST" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            CADDY_ADDRESS="http://$VM_HOST"
          fi
          cat > /tmp/kesec.env << EOF
          DOMAIN=${{ secrets.VM_HOST }}
          CADDY_ADDRESS=$CADDY_ADDRESS
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES=1440
          EOF
          scp -i ~/.ssh/deploy_key /tmp/kesec.env \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/kesec/.env"
          rm -f /tmp/kesec.env

      - name: Pull new images and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            cd ~/kesec
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
          '
