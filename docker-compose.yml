services:
  mysql:
    image: mysql:8.3
    container_name: kesec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kesec
      MYSQL_USER: kesec_user
      MYSQL_PASSWORD: kesec_password
    ports:
      - "3306:3306"
    volumes:
      - kesec_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kesec_mysql_data:
