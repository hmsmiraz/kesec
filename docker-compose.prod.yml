services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kesec
      MYSQL_USER: kesec_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - kesec_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    # No ports exposed to the host - only reachable by other containers on
    # this compose network. Caddy is the only thing facing the internet.

  backend:
    image: ${DOCKERHUB_USERNAME}/kesec-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://kesec_user:${MYSQL_PASSWORD}@mysql:3306/kesec
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: http://${DOMAIN},https://${DOMAIN}
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    image: ${DOCKERHUB_USERNAME}/kesec-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  # Runtime security monitoring - watches actual host/container syscall
  # behavior (shells spawned in containers, sensitive file access, etc.),
  # independent of everything scanned earlier in the CI pipeline. Uses the
  # modern eBPF driver (bundled into the image, no kernel module or headers
  # needed on the host) rather than the legacy kernel-module driver.
  falco:
    # The lighter falco-no-driver image failed to initialize its eBPF probe
    # on this VM's Google-customized kernel for reasons never fully
    # diagnosed (ruled out: privileges, capabilities, BTF, kernel lockdown,
    # JIT settings) - the full image works correctly, confirmed by manual
    # testing, so using that instead despite the larger image size.
    image: falcosecurity/falco:0.45.0@sha256:788f1129c542171813083d4afc61b16730a47dde8c23d9c39370acef996349b6
    container_name: falco
    restart: unless-stopped
    privileged: true # required for eBPF-based syscall monitoring
    security_opt:
      - apparmor:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  kesec_mysql_data:
  caddy_data:
  caddy_config:
